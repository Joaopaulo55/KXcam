workflows:
  kxcam-android:
    name: KX Cam Android
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          cd android
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
